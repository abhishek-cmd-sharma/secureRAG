# ==============================================================================
# SecureRAG Nginx Configuration - Production Reverse Proxy & SPA Server
# ==============================================================================

server {
    listen 80;
    server_name localhost _;

    # Maximum file upload size (supporting large enterprise documents/PDFs)
    client_max_body_size 50M;

    # Gzip compression configuration
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Frontend SPA build directory
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy for backend API requests
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for deep AI reasoning and multi-chunk RAG synthesis
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # Disable buffering for smooth streaming responses
        proxy_buffering off;
    }

    # Static assets long-term caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA routing fallback - all unmatched routes route to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prevent caching of index.html so updates are immediately visible to users
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Basic web server healthcheck
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
