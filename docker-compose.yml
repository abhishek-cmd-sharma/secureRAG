# ==============================================================================
# SecureRAG — Complete Stack Docker Compose Configuration
# Services: Qdrant Vector DB, Node.js Backend API, React/Nginx Frontend & Proxy
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Qdrant Vector Database
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: securerag-qdrant-stack
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - securerag_net

  # ----------------------------------------------------------------------------
  # 2. SecureRAG Backend API (Node.js + Express)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securerag-backend-stack
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-securerag_chunks}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-768}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
      - ALLOW_MEMORY_DB=false
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - securerag_net

  # ----------------------------------------------------------------------------
  # 3. SecureRAG Frontend & Reverse Proxy (React + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: securerag-frontend-stack
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - securerag_net

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  qdrant_storage:
    name: qdrant_storage

# ------------------------------------------------------------------------------
# Internal Bridge Network
# ------------------------------------------------------------------------------
networks:
  securerag_net:
    driver: bridge
    name: securerag_network
